apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-chaos-api
  namespace: chaos-lab
---
# Définir le droit minimal (principe du moindre privilège)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: role-chaos-api
  namespace: chaos-lab
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"] # Peut voir l'état du pod postgres, mais pas lire ses logs ni le supprimer
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["feature-flags"] # Restreint à ce ConfigMap précis uniquement
  verbs: ["get"]
---
# 3. Relier le ServiceAccount au Role via un RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bind-chaos-api
  namespace: chaos-lab
subjects:
- kind: ServiceAccount
  name: sa-chaos-api
  namespace: chaos-lab
roleRef:
  kind: Role
  name: role-chaos-api
  apiGroup: rbac.authorization.k8s.io