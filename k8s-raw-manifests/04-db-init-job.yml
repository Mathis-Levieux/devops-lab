apiVersion: batch/v1
kind: Job
metadata:
  name: init-db-job
  namespace: chaos-lab
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app: init-db
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres-service-chaos -p 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 100Mi
      containers:
        - name: init-db
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: postgres-secret
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          command:
            - sh
            - -c
            - |
              psql -v ON_ERROR_STOP=1 \
                -h postgres-service-chaos \
                -U "$POSTGRES_USER" \
                -d "$POSTGRES_DB" \
                -c 'CREATE TABLE IF NOT EXISTS items (id SERIAL PRIMARY KEY, name TEXT NOT NULL, created_at TIMESTAMP DEFAULT NOW());'
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 100Mi